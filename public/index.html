<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traction Sync</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M8 16h13m0 0-5-5m5 5-5 5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">⇄</span><span>Traction&nbsp;Sync</span></div>
    <div class="cfg">
      <label class="visually-hidden" for="cfg-name">Nombre de la sincronización</label>
      <input id="cfg-name" type="text" placeholder="Nombre de la sincronización" autocomplete="off">
      <label class="visually-hidden" for="cfg-select">Configuraciones guardadas</label>
      <select id="cfg-select"></select>
      <button id="btn-new" class="btn" type="button">Nueva</button>
      <button id="btn-save" class="btn primary" type="button">💾 Guardar</button>
      <button id="btn-delete" class="btn danger-ghost" type="button" title="Eliminar la configuración guardada">Eliminar</button>
    </div>
  </header>
  <nav id="steps" class="steps" aria-label="Pasos"></nav>
  <main id="main" class="main"></main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
