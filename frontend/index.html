<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traction Sync</title>
  <meta name="theme-color" content="#003478">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300095b'/%3E%3Cstop offset='1' stop-color='%231351b4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M7 12h16m0 0-4-4m4 4-4 4M25 21H9m0 0 4-4m-4 4 4 4' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-in">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" class="icon"><path d="M4 8h14m0 0-4-4m4 4-4 4M20 16H6m0 0 4-4m-4 4 4 4"/></svg></span>
        <span class="brand-t"><b>Traction Sync</b><small>Del origen al destino, campo a campo</small></span>
      </div>
      <div class="cfg">
        <label class="visually-hidden" for="cfg-name">Nombre de la sincronización</label>
        <input id="cfg-name" type="text" placeholder="Nombre de la sincronización" autocomplete="off">
        <label class="visually-hidden" for="cfg-select">Configuraciones guardadas</label>
        <select id="cfg-select"></select>
        <button id="btn-new" class="btn ghost" type="button">Nueva</button>
        <button id="btn-save" class="btn light" type="button">Guardar</button>
        <button id="btn-delete" class="btn ghost danger-ghost" type="button" title="Eliminar la configuración guardada">Eliminar</button>
      </div>
    </div>
    <nav id="steps" class="steps" aria-label="Pasos"></nav>
  </header>
  <main id="main" class="main"></main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
